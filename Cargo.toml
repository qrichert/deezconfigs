[package]
name = "deezconfigs"
version = "0.18.0"
edition = "2024"
authors = ["Quentin Richert <noreply@richert.co>"]
description = "Manage deez config files."
license = "MIT OR Apache-2.0"
repository = "https://github.com/qrichert/deezconfigs.git"
readme = "README.md"
keywords = ["dotfiles", "config-manager", "configuration", "symlink", "sync"]
categories = ["command-line-utilities", "config"]

[[bin]]
name = "deez"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[dependencies]
# Find files recursively, respecting ignore patterns.
ignore = "0.4.28"
# Diff files.
imara-diff = "0.2.0"
# Output text through a pager.
lessify = "0.5.0"
